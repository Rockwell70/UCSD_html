<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/login-styles.css">
    <script src="script.js"></script>
    <title>Account - Shabani's Neopalitan Pizza</title>
</head>
<body>
<header class="header">
    <img class="header-logo" src="favicon-96x96.png" alt="Shabani's Logo">
    <div class="navigation-buttons">
        <ul>
            <li><a class="navigation-links" id="home" href="index.html#top">Home</a></li>
            <li><a class="navigation-links" id="menu" href="index.html#antipasti">Menu</a></li>
            <li><a class="navigation-links" id="order-now" href="index.html#order">Order Now</a></li>
            <li><a class="login" href="login.html" title="Login" aria-label="Login">Login</a></li>
            <li><a class="navigation-links" id="contact-us" href="index.html#find-us">Contact</a></li>
            <li><a class="navigation-links" id="about-us" href="about.html">About</a></li>
            <li><a class="navigation-links" id="francais" title="Français" href="create-account-fr.html">FR</a></li>
        </ul>

    </div>
</header>

<header class="header-mobile">
    <div class="navigation-buttons-mobile">
        <ul>
            <li><a class="navigation-links" id="home-mobile" href="index.html#top">Home</a></li>
            <li><a class="navigation-links" id="menu-mobile" href="index.html#antipasti">Menu</a></li>
            <li><a class="navigation-links" id="order-now-mobile" href="index.html#order">Order Now</a></li>
            <li><a class="login" href="login.html" title="Login" aria-label="Login">Login</a></li>
            <li><a class="navigation-links" id="contact-us-mobile" href="index.html#find-us">Contact</a></li>
            <li><a class="navigation-links" id="about-us-mobile" href="about.html">About</a></li>
            <li><a class="navigation-links" id="francais-mobile" title="Français" href="create-account-fr.html">FR</a></li>

        </ul>

    </div>
</header>
<section class="post-header">
<section class="account-login">
    <h1 class="login-h1">Create an Account</h1>
    <form class="login-form" onsubmit="checkPassword()">
        <label for="account-email"></label>
        <input type="text" name="account-email" id="account-email" placeholder="Email" required>
        <label for="new-password"></label>
        <input type="password" name="account-password" id="new-password" placeholder="Password" required>
        <label for="new-password-confirm"></label>
        <input type="password" name="account-password" id="new-password-confirm" placeholder="Re-Enter Password" required>
        <button type="submit" class="login-button">Create Account</button>
    </form>

</section>
</section>
</body>
</html>
