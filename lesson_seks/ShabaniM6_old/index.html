<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
<ul class="top-box">
    <li class="wide-top-sub-box">
        <h3>Box1</h3>
    </li>

    <li class="thin-top-sub-box">
        <h3>Box2</h3>
    </li>

    <li class="thin-top-sub-box">
        <h3>Box3</h3>
    </li>
        <li class="thin-top-sub-box">
        <h3>Box4</h3>
    </li>
        <li class="thin-top-sub-box">
        <h3>Box5</h3>
    </li>
        <li class="thin-top-sub-box">
        <h3>Box6</h3>
    </li>
        <li class="thin-top-sub-box">
        <h3>Box7</h3>
    </li>
</ul>

<section class="three-col">
    <section class="three-col-one">
        <div class=three-col-box>1</div>
        <div class=three-col-box>2</div>
        <div class=three-col-box>3</div>
        <div class=three-col-box>4</div>
        <div class=three-col-box>5</div>
        <div class=three-col-box>6</div>
    </section>
    <section class="three-col-two">
        <div class=three-col-box-mid>1</div>
        <div class=three-col-box-mid>2</div>
    </section>
    <section class="three-col-three">
        <div class=three-col-box-right>3</div>
        <div class=three-col-box-right>4</div>

    </section>

</section>

<section class="bottom-box">
    <section class="bottom-box-left">
        <div class="bottom-box-left-content">""</div>
    </section>
    <section class="bottom-box-center">
        <section class="bottom-box-center-content-top">
            <div class="bottom-box-center-content-top-value">1</div>
        </section>
        <section class="bottom-box-center-content-mid">
            <div class="bottom-box-center-content-mid-value">2</div>
            <div class="bottom-box-center-content-mid-value">3</div>
        </section>
        <section class="bottom-box-center-content-bottom">
            <div class="bottom-box-center-content-bottom-value">4</div>
        </section>
    </section>
    <section class="bottom-box-right">
        <div class="bottom-box-right-content">""</div>
    </section>
</section>

</body>
</html>
