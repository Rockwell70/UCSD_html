<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Footer</title>

  <style>
    :root {
      --lightbg: lightgray;
      --middlebg: #353E43;
      --darkbg: #4c4c4c;
    }

    img {
      height: auto;
      width: 100%;
    }

    * {
      box-sizing: border-box;
    }
    
    .column {
      align-self: center;
    }

    .footer {
      background-color: var(--lightbg);
      color: white;
      display: grid;
      grid-column-start: 1;
      grid-column-end: 4;
      height: 16rem;
    }

    .sub-row1 {
      justify-self: center;
      background-color: var(--darkbg);
      height: 4rem;
      width: 32rem;
      margin-bottom: .75rem;
    }

    .sub-row2 {
      justify-self: center;
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 2rem;
      width: 32rem;
      margin-bottom: .75rem;
    }

    .filler-item-single {
      height: 4rem;
    }

    .filler-item-left {
      align-content: center;
      background-color: var(--darkbg);
      margin-right: 1rem;


    }

    .filler-item-right {
      background-color: var(--darkbg);


    }
    
    @media only screen and (max-width: 768px) {
      .sub-row1, .sub-row2 {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>
<section class="footer">
    <div class="row">
        <div class="column">
            <div class="sub-row1">
                <div class="double-column">
                    <div class="filler-item-single">Filler</div>
                </div>
            </div>
            <div class="sub-row2">
                <div class="filler-item-left">Middle-Left</div>
                <div class="filler-item-right">Middle-Right</div>
            </div>
            <div class="sub-row2">
                <div class="filler-item-left">Bottom Left</div>
                <div class="filler-item-right">Bottom Right</div>
            </div>
        </div>
    </div>
</section>
</body>
</html>
