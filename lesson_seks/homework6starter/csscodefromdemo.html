

<!DOCTYPE html>
<html>

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>

        img {
            height: auto;
            width: 100%;
        }

        * {
            box-sizing: border-box;
        }

        .row::after {
            content: "";
            clear: both;
            display: block;
        }

        /* Added outline to the rows to match the image*/
        .row {
            outline: 16px solid white;
        }

        [class*="col-"] {
            float: left;
            padding: 15px;
        }


        /* For desktop: */
        .col-1 {
            width: 8.33%;
        }

        .col-2 {
            width: 16.66%;
        }

        .col-3 {
            width: 25%;
        }

        .col-4 {
            width: 33.33%;

        }

        .col-5 {
            width: 41.66%;
        }

        .col-6 {
            width: 50%;
        }

        .col-7 {
            width: 58.33%;
        }

        .col-8 {
            width: 66.66%;
        }

        .col-9 {
            width: 75%;
        }

        .col-10 {
            width: 83.33%;
        }

        .col-11 {
            width: 91.66%;
        }

        .col-12 {
            width: 100%;
        }

        @media only screen and (max-width: 768px) {

            /* For mobile phones: */
            [class*="col-"] {
                width: 100%;
            }
        }

        .features {
            display: flex;
            background-color: lightgray;
            justify-content: space-evenly;
            gap: 10px;
            margin: 18px 20px;
        }

        .feature {
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 170px;
            padding: 36px 36px 22px;
            border-radius: 4px;
        }

        
    
        }
    </style>
</head>

<body>
<section class="features">
    <article class="feature feature--orange">
        <h3>Box1</h3>
    </article>

    <article class="feature feature--green">
        <h3>Box2</h3>
    </article>

    <article class="feature feature--purple">
        <h3>Box3</h3>
    </article>
</section>
</body>
</html>
