<!DOCTYPE html>
<html lang="en">
<head>

    <title>Shabani Module 6</title>
    <link rel="stylesheet" href="./styles/main2.css"/>
</head>
<body>
<div class="grid-container">
    <section class="header">
        <ul>
            <li class="header-box-span-two">
                <h3>Box1</h3>
            </li>

            <li class="thin-top-sub-box">

            <li class="thin-top-sub-box">

            <li class="thin-top-sub-box">

            </li>

            <li>Item 3</li>
            <li>Item 4</li>

                    <li>5</li>
